<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Collage Maker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 20px;
    }
    #template {
      position: relative;
      width: 600px;
      aspect-ratio: 1/1;
      border: 1px dashed #999;
    }
    .slot {
      position: absolute;
      background-size: cover;
      background-position: center;
      border: 1px solid #000;
      cursor: pointer;
    }
    .active {
      outline: 3px solid #4caf50;
      outline-offset: 2px;
    }
    #results img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
    }
    #results img:hover {
      border-color: #4caf50;
    }
  </style>
</head>
<body>
  <h2>My Favorite Albums — Collage Maker</h2>
  <p>Click slot to select. <b>Shift + Click</b> to upload your image.</p>

  <div id="template"></div>

  <button id="exportBtn">Download PNG</button>

  <h3>Search albums (Last.fm)</h3>
  <input id="searchInput" placeholder="Enter album or artist" style="padding:6px; width:250px;" />
  <button id="searchBtn">Search</button>

  <div id="results" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:15px;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    const template = document.getElementById("template");

    let activeSlot = null;

    const slots = [
      { x: 50, y: 160, w: 60, h: 60 },
      { x: 50, y: 240, w: 60, h: 60 },
      { x: 500, y: 160, w: 60, h: 60 },
      { x: 500, y: 240, w: 60, h: 60 },
      { x: 275, y: 160, w: 60, h: 60 },
      { x: 275, y: 240, w: 60, h: 60 },
      { x: 122.5, y: 160, w: 140, h: 140 },
      { x: 195, y: 310, w: 140, h: 140 },
      { x: 347.5, y: 235, w: 140, h: 140 },
      { x: 347.5, y: 85, w: 140, h: 140 },
      { x: 347.5, y: 390, w: 60, h: 60 },
      { x: 122.5, y: 87.5, w: 60, h: 60 },
      { x: 195, y: 87.5, w: 60, h: 60 },
      { x: 122.5, y: 310, w: 60, h: 60 },
      { x: 275, y: 460, w: 60, h: 60 },
    ];

    // ---- CREATE SLOTS ----
    slots.forEach((slot) => {
      const div = document.createElement("div");
      div.className = "slot";
      div.style.left = slot.x + "px";
      div.style.top = slot.y + "px";
      div.style.width = slot.w + "px";
      div.style.height = slot.h + "px";

      div.addEventListener("click", (e) => {
        document.querySelectorAll(".slot").forEach(s => s.classList.remove("active"));
        div.classList.add("active");
        activeSlot = div;

        // SHIFT + CLICK → upload image
        if (e.shiftKey) {
          let input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.onchange = (e) => {
            let file = e.target.files[0];
            let url = URL.createObjectURL(file);
            const img = new Image();
            img.src = url;
            img.style.width = "100%";
            img.style.height = "100%";
            img.style.objectFit = "cover";
            div.innerHTML = "";
            div.appendChild(img);
          };
          input.click();
        }
      });

      template.appendChild(div);
    });

    // ---- EXPORT PNG ----
    document.getElementById("exportBtn").onclick = () => {
      html2canvas(template, { scale: 3 }).then((canvas) => {
        let link = document.createElement("a");
        link.download = "albums_collage.png";
        link.href = canvas.toDataURL();
        link.click();
      });
    };

    // ---- LAST.FM SEARCH ----
    const API_KEY = "beef670523789904f878e9e9734fdcf1";

    document.getElementById("searchBtn").onclick = async () => {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;

      const url = `https://ws.audioscrobbler.com/2.0/?method=album.search&album=${encodeURIComponent(
        q
      )}&api_key=${API_KEY}&format=json`;

      const res = await fetch(url);
      const data = await res.json();

      const list = data.results.albummatches.album || [];
      const results = document.getElementById("results");
      results.innerHTML = "";

      list.forEach((item) => {
        const imgUrl = item.image?.[3]?.['#text'];
        if (!imgUrl) return;

        const img = document.createElement("img");
        img.src = imgUrl;

        img.onclick = () => {
          if (!activeSlot) return alert("Select a slot first (click it).");
          const inserted = new Image();
          inserted.src = imgUrl;
          inserted.style.width = "100%";
          inserted.style.height = "100%";
          inserted.style.objectFit = "cover";
          activeSlot.innerHTML = "";
          activeSlot.appendChild(inserted);
        };

        results.appendChild(img);
      });
    };
  </script>
</body>
</html>
